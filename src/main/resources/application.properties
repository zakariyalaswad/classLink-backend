server.port=${PORT:8081}
spring.application.name=classlink

# Firebase project: Realtime Database (REST) + ID-token verification
firebase.project-id=${FIREBASE_PROJECT_ID:claink-b3eb5}
firebase.database-url=${FIREBASE_DATABASE_URL:https://claink-b3eb5-default-rtdb.firebaseio.com}
# Database secret: never commit it. Put it in ./local.properties (git-ignored) or env FIREBASE_DATABASE_SECRET.
firebase.database-secret=${FIREBASE_DATABASE_SECRET:}
spring.config.import=optional:file:./local.properties

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# SMTP Email notifications (Render env vars or local.properties)
spring.mail.host=${mail.host:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${mail.port:${MAIL_PORT:587}}
spring.mail.username=${mail.username:${MAIL_USERNAME:}}
spring.mail.password=${mail.password:${MAIL_PASSWORD:}}
app.mail.from=${mail.from:${MAIL_FROM:${spring.mail.username:}}}
app.mail.test-to=${mail.test-to:${MAIL_TEST_TO:}}
app.mail.max-retries=${MAIL_MAX_RETRIES:2}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=6000
spring.mail.properties.mail.smtp.timeout=6000
spring.mail.properties.mail.smtp.writetimeout=6000

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Paris
logging.level.xakariya.classlink=INFO
